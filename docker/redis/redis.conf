# DooTask Redis 生产配置
# 来源: RUNBOOK 件 3 (2026-04-17), 圆桌地板共识
#
# 情况 B 判定:
#   .env 中 CACHE_DRIVER=redis, SESSION_DRIVER=redis, QUEUE_CONNECTION=redis
#   → Redis 存登录会话 + 异步队列, 非纯 cache, 必须持久化
#
# 策略: AOF everysec (平衡持久化和性能) + RDB 辅助快速启动
#       - AOF 丢失最多 1 秒数据
#       - RDB 在 Redis 启动时优先加载 (比重放 AOF 快)

# ============ AOF 持久化 (主策略) ============
appendonly yes
appendfsync everysec
appendfilename "appendonly.aof"

# AOF 自动重写 (防文件无限膨胀)
# 触发: 当前大小 >= 上次 rewrite 后的 1 倍, 且 >= 64MB
auto-aof-rewrite-percentage 100
auto-aof-rewrite-min-size 64mb

# ============ RDB 快照 (辅助) ============
# save <seconds> <changes>
# 900s (15min) 内 >= 1 次写 触发快照
# 300s (5min) 内 >= 10 次写 触发
# 60s 内 >= 10000 次写 触发
save 900 1
save 300 10
save 60 10000
dbfilename "dump.rdb"

# ============ 磁盘保护 ============
# stop-writes-on-bgsave-error: 磁盘写 RDB/AOF 失败时是否拒绝写入
# 保守值 yes (默认): 磁盘问题直接暴露, 防止数据错乱
# 前提: 磁盘告警 cron (85% 阈值) 已装 —— INCIDENT-2026-04-15 改进项 #2
stop-writes-on-bgsave-error yes

# ============ 数据目录 ============
# 对应 compose.yml 的 redis_data volume
dir /data

# ============ 网络 / 容器适配 ============
# 容器内部访问, 不对外暴露, 无需密码
# (DooTask 网络隔离由 docker network 提供)
bind 0.0.0.0
protected-mode no
port 6379
timeout 0
tcp-keepalive 300

# ============ 日志 ============
loglevel notice
# 日志输出到 stdout, 由 docker logs 收集
# 注: Redis conf 不支持行尾注释, # 只能在行首, 否则 wrong number of arguments
logfile ""
