map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}
map $http_host $this_host {
    "" $host;
    default $http_host;
}
map $http_x_forwarded_proto $the_scheme {
     default $http_x_forwarded_proto;
     "" $scheme;
}
map $http_x_forwarded_host $the_host {
    default $http_x_forwarded_host;
    "" $this_host;
}
upstream service {
    server php:20000 weight=5 max_fails=3 fail_timeout=30s;
    keepalive 16;
}
server {
    listen 80;

    # uhomes: 开启 gzip 压缩，缓解出网带宽有限导致静态资源慢（~180KB/s 外网带宽下，
    # 765KB 的 JS 原始传输需要 4+ 秒，gzip 后可降到 ~1 秒）
    gzip on;
    gzip_vary on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types
        application/javascript
        application/json
        application/x-javascript
        application/xml
        text/css
        text/plain
        text/xml
        image/svg+xml
        font/ttf
        font/otf;

    # uhomes: 给带 hash 的静态资源设长缓存（Vite 输出的文件名带内容哈希，改动时文件名变）
    # 注意：未命中物理文件时必须回退到 @laravels，否则 /avatar/<昵称>.png 这类
    # PHP 动态生成的虚拟路由会被 nginx 直接 404（IndexController::avatar）
    # 部署时若本文件 inode 漂移，deploy.sh 会自动 docker restart nginx
    # （详见 docs/INCIDENT_2026-04-22_NGINX_INODE_DRIFT.md）
    location ~* \.(js|css|woff2?|ttf|otf|svg|png|jpg|jpeg|gif|ico)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        access_log off;
        try_files $uri @laravels;
    }

    include /var/www/docker/nginx/site/*.conf;

    root /var/www/public;

    client_max_body_size  1024M;

    autoindex off;
    index index.html index.htm index.php;

    charset utf-8;

    add_header Access-Control-Expose-Headers "Date, Last-Modified, Age" always;

    location / {
        if ($uri ~* "^/uploads/.*\.(jpe?g|png|gif|webp)$") {
            add_header Access-Control-Allow-Origin "http://localhost:22223" always;
            add_header Access-Control-Allow-Methods "GET, OPTIONS" always;
            add_header Access-Control-Allow-Headers "DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range,Authorization" always;
            add_header Access-Control-Allow-Credentials "true" always;
        }

        try_files $uri @laravels;
    }

    location ~ \.well-known{
        allow all;
    }

    location =/ws {
        proxy_http_version 1.1;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Real-PORT $remote_port;
        proxy_set_header X-Forwarded-Host $the_host;
        proxy_set_header X-Forwarded-Proto $the_scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Host $http_host;
        proxy_set_header Scheme $scheme;
        proxy_set_header Server-Protocol $server_protocol;
        proxy_set_header Server-Name $server_name;
        proxy_set_header Server-Addr $server_addr;
        proxy_set_header Server-Port $server_port;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_connect_timeout 3600s;
        proxy_pass http://service;
    }

    location @laravels {
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Real-PORT $remote_port;
        proxy_set_header X-Forwarded-Host $the_host;
        proxy_set_header X-Forwarded-Proto $the_scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Host $http_host;
        proxy_set_header Scheme $scheme;
        proxy_set_header Server-Protocol $server_protocol;
        proxy_set_header Server-Name $server_name;
        proxy_set_header Server-Addr $server_addr;
        proxy_set_header Server-Port $server_port;
        proxy_pass http://service;
    }

    # [DISABLED] appstore container not available - image pull failed
    # location /appstore/ {
    #     proxy_pass http://appstore/;
    # }

    # include /var/www/docker/appstore/config/*/nginx.conf;
}

include /var/www/docker/nginx/conf.d/*.conf;
