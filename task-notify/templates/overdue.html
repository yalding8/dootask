<!DOCTYPE html>
<html>
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"></head>
<body style="margin:0;padding:0;background-color:#f5f5f5;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;">
<table width="100%" cellpadding="0" cellspacing="0" style="background-color:#f5f5f5;padding:20px 0;">
<tr><td align="center">
<table width="580" cellpadding="0" cellspacing="0" style="background-color:#ffffff;border-radius:8px;overflow:hidden;box-shadow:0 2px 8px rgba(0,0,0,0.08);">

<!-- Color Bar -->
<tr><td style="background-color:${color_bar};height:6px;"></td></tr>

<!-- Content -->
<tr><td style="padding:24px 32px;">

  <!-- Task Info -->
  <table width="100%" cellpadding="0" cellspacing="0">
    <tr><td style="font-size:18px;font-weight:bold;color:#202020;padding-bottom:16px;line-height:1.4;">
      ${task_name}
    </td></tr>
    <tr><td style="font-size:14px;color:#555;padding-bottom:8px;">
      &#128100; 指派: ${assigner_name} &rarr; 负责: ${owner_name}
    </td></tr>
    <tr><td style="font-size:14px;color:#555;padding-bottom:8px;">
      &#9200; 截止: ${deadline} <span style="color:${color_bar};font-weight:bold;">(${time_remaining})</span>
    </td></tr>
    <tr><td style="font-size:14px;color:#555;padding-bottom:8px;">
      <span style="display:inline-block;width:10px;height:10px;border-radius:50%;background-color:${priority_color};vertical-align:middle;"></span>
      优先级: ${priority_name} &nbsp;&nbsp;|&nbsp;&nbsp; 状态: ${status_name} &nbsp;&nbsp;|&nbsp;&nbsp; 项目: ${project_name}
    </td></tr>
  </table>

  <!-- Divider -->
  <div style="border-top:1px solid #e8e8e8;margin:16px 0;"></div>

  <!-- Context Message -->
  <p style="font-size:14px;color:#333;margin:0 0 24px 0;line-height:1.6;">
    ${context_msg}
  </p>

  <!-- Action Button -->
  <table cellpadding="0" cellspacing="0">
    <tr><td style="background-color:${color_bar};border-radius:6px;">
      <a href="${task_url}" target="_blank"
         style="display:inline-block;padding:12px 32px;color:#ffffff;text-decoration:none;font-size:14px;font-weight:bold;">
        ${btn_text}
      </a>
    </td></tr>
  </table>

</td></tr>

<!-- Footer -->
<tr><td style="padding:16px 32px;background-color:#fafafa;border-top:1px solid #eee;">
  <p style="font-size:12px;color:#999;margin:0;line-height:1.6;">
    此邮件由 DooTask 工单系统自动发送，请勿直接回复。<br>
    如需调整通知频率，请联系管理员（丁宁）。<br>
    <a href="${base_url}" style="color:#999;">task.critvo.com</a>
  </p>
</td></tr>

</table>
</td></tr>
</table>
</body>
</html>
