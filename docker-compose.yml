services:
  php:
    container_name: "dootask-php-${APP_ID}"
    image: "kuaifan/php:swoole-8.0.rc21"
    shm_size: 2G
    ulimits:
      core:
        soft: 0
        hard: 0
    volumes:
      - shared_data:/usr/share/dootask
      - ./docker/crontab/crontab.conf:/etc/supervisor/conf.d/crontab.conf
      - ./docker/php/php.conf:/etc/supervisor/conf.d/php.conf
      - ./docker/php/php.ini:/usr/local/etc/php/php.ini
      - ./docker/logs/supervisor:/var/log/supervisor
      - ./:/var/www
    environment:
      LANG: "C.UTF-8"
      MODE: "production"
      MYSQL_HOST: "${DB_HOST}"
      MYSQL_PORT: "${DB_PORT}"
      MYSQL_DB_NAME: "${DB_DATABASE}"
      MYSQL_USERNAME: "${DB_USERNAME}"
      MYSQL_PASSWORD: "${DB_PASSWORD}"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:${LARAVELS_LISTEN_PORT}/health"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - extnetwork
    depends_on:
      mariadb:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    # 固化 2026-04-17 发现的 runtime limit (之前 docker update 设的 2.5GB).
    # 稳态 ~750MB, 含 BD 日报批处理峰值, 2.5GB 留 3x 余量.
    mem_limit: 2560m
    memswap_limit: 2560m
    mem_reservation: 1g

  nginx:
    container_name: "dootask-nginx-${APP_ID}"
    image: "nginx:alpine"
    ports:
      - "${APP_PORT}:80"
      - "${APP_SSL_PORT:-0}:443"
    volumes:
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
      - ./:/var/www
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/health"]
      interval: 5s
      timeout: 5s
      retries: 5
    depends_on:
      php:
        condition: service_healthy
    networks:
      - extnetwork
    restart: unless-stopped
    # INCIDENT-2026-04-16 事故 1 教训: 主机 7GB 无 swap, OOM 会直接 kill 进程.
    # 2026-04-17 实测 nginx 稳态 14MB, 设 256MB 留 18x 余量.
    mem_limit: 256m
    memswap_limit: 256m
    mem_reservation: 64m

  redis:
    container_name: "dootask-redis-${APP_ID}"
    image: "redis:alpine"
    # 挂载自定义 redis.conf (持久化策略见文件注释)
    # 2026-04-17 RUNBOOK 件 3: 情况 B (session+queue), 启用 AOF everysec
    command: ["redis-server", "/etc/redis/redis.conf"]
    volumes:
      - redis_data:/data
      - ./docker/redis/redis.conf:/etc/redis/redis.conf:ro
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - extnetwork
    restart: unless-stopped
    # 固化 2026-04-17 发现的 runtime limit (之前 docker update 设的 512MB,
    # 没在 compose, 容器 recreate 会丢). 实测稳态 10MB, 512MB 留大幅余量.
    mem_limit: 512m
    memswap_limit: 512m
    mem_reservation: 128m

  mariadb:
    container_name: "dootask-mariadb-${APP_ID}"
    image: "mariadb:10.7.3"
    ports:
      - "127.0.0.1:3306:3306"
    volumes:
      - ./docker/mysql/repassword.sh:/etc/mysql/repassword.sh
      - ./docker/mysql/conf.d:/etc/mysql/conf.d
      - ./docker/mysql/data:/var/lib/mysql
    environment:
      MYSQL_PREFIX: "${DB_PREFIX}"
      MYSQL_ROOT_PASSWORD: "${DB_ROOT_PASSWORD}"
      MYSQL_DATABASE: "${DB_DATABASE}"
      MYSQL_USER: "${DB_USERNAME}"
      MYSQL_PASSWORD: "${DB_PASSWORD}"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "${DB_USERNAME}", "-p${DB_PASSWORD}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - extnetwork
    restart: unless-stopped
    # 固化 2026-04-17 runtime limit (1.5GB). 稳态 ~450MB, 留 3x 余量.
    mem_limit: 1536m
    memswap_limit: 1536m
    mem_reservation: 512m

  appstore:
    container_name: "dootask-appstore-${APP_ID}"
    privileged: true
    image: "dootask/appstore:0.4.0"
    volumes:
      - shared_data:/usr/share/dootask
      - ${HOST_DOCKER_SOCK:-/var/run/docker.sock}:/var/run/docker.sock
      - ./:/var/www
    environment:
      HOST_PWD: "${PWD}"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/health"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - extnetwork
    restart: unless-stopped
    # appstore 自己只是个 orchestrator (实测稳态 25MB), 512MB 应付启动插件短暂峰值.
    # 注意: appstore 启动的 app-* 插件容器是独立 container, 不占此 budget.
    mem_limit: 512m
    memswap_limit: 512m
    mem_reservation: 128m

networks:
  extnetwork:
    name: "dootask-networks-${APP_ID}"

volumes:
  shared_data:
    name: "dootask-shared-data-${APP_ID}"
  redis_data:
    name: "dootask-redis-data-${APP_ID}"
